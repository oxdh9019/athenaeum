name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend soul-system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: v0.7/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run soul system tests
        working-directory: v0.7
        run: python3 tests/test_v07_soul_system.py

  frontend-lint-typecheck:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v0.7/client/package-lock.json
      - name: Install dependencies
        working-directory: v0.7/client
        run: npm ci
      - name: Typecheck
        working-directory: v0.7/client
        run: npm run typecheck
      - name: Lint
        working-directory: v0.7/client
        run: npm run lint
      - name: Build
        working-directory: v0.7/client
        run: npm run build

  frontend-e2e-smoke:
    name: Frontend e2e smoke (no LLM)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        working-directory: v0.7/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend deps + build
        working-directory: v0.7/client
        run: |
          npm ci
          npm run build
      - name: Start FastAPI server (background)
        working-directory: v0.7/server
        run: |
          python server.py &
          sleep 3
          curl -fsS http://localhost:8000/health || (echo "server failed to start"; exit 1)
      - name: Run smoke tests
        working-directory: v0.7/client
        run: npx playwright install --with-deps chromium && npm run test:smoke
