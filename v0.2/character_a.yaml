  stubbornness: 0.6

backstory: |
  在翡翠城图书馆工作了20年，从管理员助理成长为受人尊敬的学者。
  丈夫十年前去世，此后图书馆成为她真正的家。
  性格谨慎、内敛，但对熟人会流露出温柔和关怀。
