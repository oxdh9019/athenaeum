      openness: 0.7
      conscientiousness: 0.9
      extraversion: 0.3
      agreeableness: 0.8
      neuroticism: 0.4
    extended:
      empathy: 0.7
      humor: 0.3
      ambition: 0.5
      loyalty: 0.9
      courage: 0.4
      patience: 0.8
      generosity: 0.5

