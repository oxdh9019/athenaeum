# pytest 配置（V0.7）
# 用途：pytest-cov 覆盖率报告
# 运行：pytest --cov=core --cov-report=term-missing
#       pytest --cov=core --cov-report=html  # 生成 htmlcov/index.html
#
# 当前项目测试以 plain script 为主（test_v07_soul_system.py），
# pytest-cov 适用于编写 v0.7/server/core/test_*.py 时按 pytest 规范收集。

[pytest]
asyncio_mode = auto
testpaths = tests core
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
pythonpath = .

[coverage:run]
source = core
omit =
    core/__pycache__/*
    core/test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
show_missing = True
skip_covered = False
